name: Tests

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        swift: ['5.10', '6.0']
    container:
      image: swift:${{ matrix.swift }}
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build -v
      - name: Run unit tests
        # 2026-11-05 09:26 +03: phone tests read the test number from this secret and skip when unset. int-testnumber
        env:
          KWTSMS_TEST_NUMBER: ${{ secrets.KWTSMS_TEST_NUMBER }}
        # 2026-11-05 14:22 +03: UserAgentTests added (offline), #939.
        run: swift test --filter "PhoneTests|MessageTests|ApiErrorTests|UserAgentTests" -v
